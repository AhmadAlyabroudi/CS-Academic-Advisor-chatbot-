version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: justadvisor_chatbot
    network_mode: "host"
    env_file:
      - backend/.env
    restart: always
    working_dir: /app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
