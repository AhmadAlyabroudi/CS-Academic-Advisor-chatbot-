name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy to Droplet
    runs-on: ubuntu-latest
    # Only deploy when CI passes
    needs: []

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          script: |
            set -e
            cd /var/www/justadvisor
            git fetch origin main
            git reset --hard origin/main
            
            # Stop the old systemd service and free port 8080 (our target port) to prevent conflicts
            sudo systemctl stop justadvisor || true
            sudo systemctl disable justadvisor || true
            sudo fuser -k 8080/tcp || true
            
            # Force stop and remove any old container named just_advisor_app to clean up conflicts
            sudo docker rm -f just_advisor_app || true
            
            # Down the compose stack to clean up previous containers from this project
            sudo docker-compose down || true
            sudo docker compose down || true
            
            # Build and restart the container (detecting docker compose version)
            if docker compose version &>/dev/null; then
              docker compose up -d --build
              sleep 5
              echo "=== Docker Status ==="
              docker compose ps
              echo "=== Container Logs ==="
              docker compose logs --tail=50
            else
              docker-compose up -d --build
              sleep 5
              echo "=== Docker Status ==="
              docker-compose ps
              echo "=== Container Logs ==="
              docker-compose logs --tail=50
            fi

      - name: Notify success
        if: success()
        run: echo "✅ Deployed successfully to ${{ secrets.DROPLET_HOST }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed — check the Actions log for details."
