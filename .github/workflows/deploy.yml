name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy to Droplet
    runs-on: ubuntu-latest
    # Only deploy when CI passes
    needs: []

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          script: |
            set -e
            cd /var/www/justadvisor
            git fetch origin main
            git reset --hard origin/main
            
            # Stop the old systemd service and free port 8000 to prevent conflicts
            sudo systemctl stop justadvisor || true
            sudo systemctl disable justadvisor || true
            sudo fuser -k 8000/tcp || true
            
            # Build and restart the container (detecting docker compose version)
            if docker compose version &>/dev/null; then
              docker compose down
              docker compose up -d --build
            else
              docker-compose down
              docker-compose up -d --build
            fi

      - name: Notify success
        if: success()
        run: echo "✅ Deployed successfully to ${{ secrets.DROPLET_HOST }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed — check the Actions log for details."
