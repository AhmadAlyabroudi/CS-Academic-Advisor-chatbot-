<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Room | JUST Advisor</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --meeting-bg: #0f172a;
      --tile-bg: #1e293b;
      --control-bg: #334155;
    }
    .room-container {
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      background: var(--meeting-bg);
      border-radius: 1.5rem;
      margin: 0.5rem;
      color: white;
      overflow: hidden;
    }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .room-title h1 { font-size: 1.3rem; margin: 0; color: white; }
    .room-meta { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.25rem; font-size:0.85rem; }

    .room-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 0.5rem;
    }
    .video-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      position: relative;
      overflow: hidden;
    }
    .video-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      align-content: center;
    }
    .video-card {
      background: var(--tile-bg);
      border-radius: 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.05);
      min-height: 180px;
    }
    .video-card video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-card .cam-off { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .avatar-circle {
      width: 72px; height: 72px;
      background: #6366f1;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 700; color: white;
    }
    .participant-name {
      position: absolute; bottom: 0.5rem; left: 0.75rem;
      background: rgba(0,0,0,0.55);
      padding: 2px 10px; border-radius: 0.5rem;
      font-size: 0.78rem; font-weight: 600; backdrop-filter: blur(4px);
    }
    .status-badge {
      position: absolute; top: 0.6rem; left: 0.75rem;
      background: rgba(0,0,0,0.45);
      padding: 2px 10px; border-radius: 0.5rem;
      font-size: 0.75rem; backdrop-filter: blur(4px);
    }

    .room-controls {
      display: flex; justify-content: center; align-items: center; gap: 1.25rem;
      padding: 1rem 1.5rem;
      background: rgba(30,41,59,0.85);
      backdrop-filter: blur(10px);
      border-radius: 5rem;
      width: fit-content;
      margin: 0 auto 0.75rem;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .control-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: var(--control-bg); color: #94a3b8;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; font-size: 1.05rem; position: relative;
    }
    .control-btn:hover { background: #475569; color: white; transform: translateY(-2px); }
    .control-btn.active { background: #10b981; color: white; box-shadow: 0 0 14px rgba(16,185,129,0.4); }
    .control-btn.active#screenBtn { background: #3b82f6; }
    .control-btn.active#chatBtn { background: #8b5cf6; }

    .unread-badge {
      position: absolute; top: -4px; right: -4px;
      background: #ef4444; color: white; border-radius: 50%;
      width: 18px; height: 18px; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-leave {
      background: #ef4444; color: white; padding: 0.55rem 1.1rem;
      border-radius: 0.7rem; font-weight: 600; font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.5rem; border: none; cursor: pointer;
    }
    .btn-leave:hover { background: #dc2626; }
    .btn-terminate {
      background: transparent; color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.55rem 1.1rem; border-radius: 0.7rem;
      font-size: 0.85rem; cursor: pointer;
    }
    .btn-terminate:hover { background: rgba(239,68,68,0.12); color: #ef4444; border-color:#ef4444; }

    /* ── Chat Panel ── */
    .chat-panel {
      width: 300px; flex-shrink: 0;
      background: #1e293b;
      border-radius: 1rem;
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .chat-panel.open { display: flex; }
    .chat-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.9rem; font-weight: 700; color: #e2e8f0;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 0.75rem;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .chat-msg { padding: 0.5rem 0.75rem; border-radius: 0.65rem; max-width: 100%; word-break: break-word; font-size: 0.82rem; }
    .chat-msg.mine { background: #6366f1; color: white; align-self: flex-end; }
    .chat-msg.theirs { background: #334155; color: #e2e8f0; align-self: flex-start; }
    .chat-msg .msg-sender { font-weight: 700; font-size: 0.75rem; margin-bottom: 2px; opacity: 0.8; }
    .chat-msg .msg-time { font-size: 0.68rem; opacity: 0.55; margin-top: 3px; text-align: right; }
    .chat-input-area {
      padding: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 0.5rem;
    }
    .chat-input-area input {
      flex: 1; background: #334155; border: none; border-radius: 0.6rem;
      padding: 0.5rem 0.75rem; color: white; font-size: 0.85rem; outline: none;
    }
    .chat-send-btn {
      width: 34px; height: 34px; border-radius: 0.6rem;
      background: #6366f1; border: none; color: white;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--meeting-bg); display: flex; justify-content: center;
      align-items: center; font-size: 1.5rem; font-weight: bold; z-index: 99;
    }
  </style>
</head>
<body>
<div class="page-with-sidebar">
  <aside class="sidebar"></aside>
  <div class="main-content">
    <div class="top-bar"></div>
    <div class="content-area room-container" id="roomContainer">

      <div id="loadingOverlay" class="loading-overlay">
        <div style="text-align: center;">
          <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: #6366f1; margin-bottom: 1rem;"></i>
          <div>Loading Study Room...</div>
        </div>
      </div>

      <div class="room-header">
        <div class="room-title">
          <h1 id="roomName">Connecting…</h1>
          <div class="room-meta">
            <span id="roomTypeTag" class="tag">TYPE</span>
            <span><i class="fas fa-users"></i> <span id="memberCount">1</span> Members</span>
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;align-items:center;">
          <button id="terminateBtn" class="btn-terminate" style="display:none" onclick="terminateRoom()">
            Terminate Room
          </button>
          <button class="btn-leave" onclick="leaveRoom()">
            <i class="fas fa-phone-slash"></i> Leave Room
          </button>
        </div>
      </div>

      <div class="room-body">
        <div class="video-area">
          <div class="video-grid" id="videoGrid">
            <div class="video-card" id="localTile">
              <div class="status-badge">You</div>
              <div class="cam-off" id="localPlaceholder">
                <div class="avatar-circle" id="avatarInitial">A</div>
                <span style="font-size:0.85rem;color:#94a3b8" id="localName">You</span>
              </div>
              <div id="localVideoContainer" style="width:100%; height:100%; display:none;"></div>
              <span class="participant-name" id="localDisplayName">You</span>
            </div>
          </div>
        </div>

        <div class="chat-panel" id="chatPanel">
          <div class="chat-header">
            <span><i class="fas fa-comments" style="margin-right:6px"></i>Room Chat</span>
            <button onclick="toggleChat()" style="background:none;border:none;color:#94a3b8;cursor:pointer;">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message…" onkeydown="handleChatKey(event)"/>
            <button class="chat-send-btn" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>

      <div class="room-controls">
        <button class="control-btn" id="micBtn" title="Toggle Mic" onclick="toggleMic()">
          <i class="fas fa-microphone-slash"></i>
        </button>
        <button class="control-btn" id="camBtn" title="Toggle Camera" onclick="toggleCam()">
          <i class="fas fa-video-slash"></i>
        </button>
        <button class="control-btn" id="screenBtn" title="Share Screen" onclick="toggleScreen()">
          <i class="fas fa-desktop"></i>
        </button>
        <button class="control-btn" id="chatBtn" title="Toggle Chat" onclick="toggleChat()">
          <i class="fas fa-comments"></i>
          <span class="unread-badge" id="unreadBadge" style="display:none">0</span>
        </button>
      </div>

    </div>
    <footer class="site-footer"></footer>
  </div>
</div>

<script src="sidebar.js?v=8"></script>
<script>
const params     = new URLSearchParams(window.location.search);
const roomId     = parseInt(params.get('id'));
const roomType   = params.get('type');
const studentId  = localStorage.getItem('student_id') || '';

let myName        = 'Student';
let currentRoom   = null;
let unreadCount   = 0;
let chatOpen      = false;

// انطلاق محرك الغرفة فور تحميل الـ DOM
document.addEventListener('DOMContentLoaded', async () => {
  if (!roomId || !roomType) { window.location.href = 'study-rooms.html'; return; }

  // 1. جلب معلومات الغرفة لتحديث الهيدر والـ UI
  try {
    const rRes = await fetch(`/rooms/${roomType}/${roomId}`);
    const room = await rRes.json();
    document.getElementById('roomName').textContent = room.name;
    const tag = document.getElementById('roomTypeTag');
    tag.textContent = room.type.toUpperCase();
    tag.className = `tag ${room.type === 'Official' ? 'tag-blue' : 'tag-purple'}`;

    if (room.creator_id === studentId) {
      document.getElementById('terminateBtn').style.display = 'inline-flex';
    }
  } catch (_) {}

  // 2. جلب اسم الطالب الحالي من الـ API لبثه للآخرين داخل الـ SFU
  try {
    const sRes = await fetch(`/student/${studentId}`);
    const s = await sRes.json();
    if (s && s.first_name) {
      myName = `${s.first_name} ${s.last_name}`;
      document.getElementById('localName').textContent = myName;
      document.getElementById('localDisplayName').textContent = myName;
      document.getElementById('avatarInitial').textContent = s.first_name.charAt(0).toUpperCase();
    }
  } catch (_) {}

  // 3. بدء عملية توليد التوكن والاتصال التلقائي بالـ LiveKit SFU
  await connectToLiveKit();
});

async function connectToLiveKit() {
  try {
    // جلب التوكن الرسمي الآمن من نقطة الباكيند لـ FastAPI الخاص بك
    const response = await fetch(`/rooms/token?room_id=${roomId}&student_id=${studentId}&name=${encodeURIComponent(myName)}`);
    if (!response.ok) throw new Error('Failed to fetch token from backend');
    const tData = await response.json();

    // إنشاء كائن الغرفة من مكتبة LiveKit Client الرسمية
    currentRoom = new LiveKitClient.Room({
      adaptiveStream: true,
      dynacast: true,
    });

    // إعداد مستمعي الأحداث البرمجية للـ SFU (إضافة مشاركين، بث ميديا، شات حي)
    setupRoomListeners();

    // التوصيل الذهبي المباشر عبر منفذ الـ SSL المستقل
    await currentRoom.connect('wss://csacademicadvisorchatbot.codes:7880', tData.token);

    // إخفاء شاشة الانتظار فور نجاح الاتصال
    document.getElementById('loadingOverlay').style.display = 'none';
    updateMemberCount();

  } catch (err) {
    console.error('LiveKit connection error:', err);
    alert('Failed to connect to the global stream server.');
  }
}

function setupRoomListeners() {
  // عند دخول شخص جديد للغرفة
  currentRoom.on(LiveKitClient.RoomEvent.ParticipantConnected, (participant) => {
    addRemoteTile(participant);
    updateMemberCount();
  });

  // عند خروج شخص من الغرفة
  currentRoom.on(LiveKitClient.RoomEvent.ParticipantDisconnected, (participant) => {
    removeRemoteTile(participant);
    updateMemberCount();
  });

  // عندما يقوم شخص ما (قريب أو بعيد) بفتح الكاميرا أو المايكروفون
  currentRoom.on(LiveKitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
    if (track.kind === LiveKitClient.Track.Kind.Video) {
      attachTrack(track, participant);
    } else if (track.kind === LiveKitClient.Track.Kind.Audio) {
      const audioElement = track.attach();
      document.body.appendChild(audioElement);
    }
  });

  // عندما يقوم شخص بإغلاق الكاميرا أو المايكروفون
  currentRoom.on(LiveKitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
    if (track.kind === LiveKitClient.Track.Kind.Video) {
      track.detach();
      togglePlaceholderVisibility(participant, true);
    }
  });

  // استقبال وإرسال رسائل الشات الحية المدمجة في الـ SFU Data Channel
  currentRoom.on(LiveKitClient.RoomEvent.DataReceived, (payload, participant) => {
    const str = new TextDecoder().decode(payload);
    try {
      const data = JSON.parse(str);
      if (data.type === 'chat') {
        appendChatMessage('theirs', participant ? participant.identity : 'Student', data.message, data.time);
        if (!chatOpen) {
          unreadCount++;
          const badge = document.getElementById('unreadBadge');
          badge.textContent = unreadCount;
          badge.style.display = 'flex';
        }
      }
    } catch (_) {}
  });
}

function addRemoteTile(participant) {
  if (document.getElementById(`tile-${participant.sid}`)) return;

  const grid = document.getElementById('videoGrid');
  const card = document.createElement('div');
  card.className = 'video-card';
  card.id = `tile-${participant.sid}`;

  const initial = (participant.identity || 'S').charAt(0).toUpperCase();
  card.innerHTML = `
    <div class="cam-off" id="ph-${participant.sid}">
      <div class="avatar-circle">${initial}</div>
      <span style="font-size:0.85rem;color:#94a3b8">${participant.identity}</span>
    </div>
    <div id="vcont-${participant.sid}" style="width:100%; height:100%; display:none;"></div>
    <span class="participant-name">${participant.identity}</span>
  `;
  grid.appendChild(card);
}

function removeRemoteTile(participant) {
  const tile = document.getElementById(`tile-${participant.sid}`);
  if (tile) tile.remove();
}

function attachTrack(track, participant) {
  const isLocal = participant.sid === currentRoom.localParticipant.sid;
  const containerId = isLocal ? 'localVideoContainer' : `vcont-${participant.sid}`;
  const phId = isLocal ? 'localPlaceholder' : `ph-${participant.sid}`;

  if (!isLocal && !document.getElementById(`tile-${participant.sid}`)) {
    addRemoteTile(participant);
  }

  const container = document.getElementById(containerId);
  const ph = document.getElementById(phId);

  if (container) {
    container.innerHTML = '';
    const el = track.attach();
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.objectFit = 'cover';
    container.appendChild(el);
    container.style.display = 'block';
    if (ph) ph.style.display = 'none';
  }
}

function togglePlaceholderVisibility(participant, showPlaceholder) {
  const isLocal = participant.sid === currentRoom.localParticipant.sid;
  const containerId = isLocal ? 'localVideoContainer' : `vcont-${participant.sid}`;
  const phId = isLocal ? 'localPlaceholder' : `ph-${participant.sid}`;

  const container = document.getElementById(containerId);
  const ph = document.getElementById(phId);

  if (showPlaceholder) {
    if (container) container.style.display = 'none';
    if (ph) ph.style.display = 'flex';
  } else {
    if (container) container.style.display = 'block';
    if (ph) ph.style.display = 'none';
  }
}

function updateMemberCount() {
  if (!currentRoom) return;
  const count = 1 + currentRoom.remoteParticipants.size;
  document.getElementById('memberCount').textContent = count;
}

// ─── أزرار التحكم بالميديا باستخدام الـ LiveKit API المباشر ───
async function toggleMic() {
  if (!currentRoom) return;
  const btn = document.getElementById('micBtn');
  const icon = btn.querySelector('i');
  const isEnabled = currentRoom.localParticipant.isMicrophoneEnabled;

  await currentRoom.localParticipant.setMicrophoneEnabled(!isEnabled);
  btn.classList.toggle('active', !isEnabled);
  icon.className = !isEnabled ? 'fas fa-microphone' : 'fas fa-microphone-slash';
}

async function toggleCam() {
  if (!currentRoom) return;
  const btn = document.getElementById('camBtn');
  const icon = btn.querySelector('i');
  const isEnabled = currentRoom.localParticipant.isCameraEnabled;

  await currentRoom.localParticipant.setCameraEnabled(!isEnabled);
  btn.classList.toggle('active', !isEnabled);
  icon.className = !isEnabled ? 'fas fa-video' : 'fas fa-video-slash';

  // معالجة الفيديو المحلي فوراً للعرض على الشاشة الشخصية
  if (!isEnabled) {
    const trackPub = currentRoom.localParticipant.getTrackPublication(LiveKitClient.Track.Source.Camera);
    if (trackPub && trackPub.track) {
      attachTrack(trackPub.track, currentRoom.localParticipant);
    }
  } else {
    togglePlaceholderVisibility(currentRoom.localParticipant, true);
  }
}

async function toggleScreen() {
  if (!currentRoom) return;
  const btn = document.getElementById('screenBtn');
  const isEnabled = currentRoom.localParticipant.isScreenShareEnabled;

  try {
    await currentRoom.localParticipant.setScreenShareEnabled(!isEnabled);
    btn.classList.toggle('active', !isEnabled);
  } catch (_) {}
}

// ─── إدارة الدردشة الفورية المستقرة عبر الـ SFU Data Channels ───
function toggleChat() {
  chatOpen = !chatOpen;
  const panel = document.getElementById('chatPanel');
  const btn   = document.getElementById('chatBtn');
  panel.classList.toggle('open', chatOpen);
  btn.classList.toggle('active', chatOpen);
  if (chatOpen) {
    unreadCount = 0;
    document.getElementById('unreadBadge').style.display = 'none';
  }
}

function handleChatKey(e) {
  if (e.key === 'Enter') sendChatMessage();
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const msg   = input.value.trim();
  if (!msg || !currentRoom) return;

  const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const chatPayload = JSON.stringify({ type: 'chat', message: msg, time: timeStr });

  // إرسال الرسالة لجميع الحاضرين عبر قنوات البيانات الفورية الخفيفة
  const encoder = new TextEncoder();
  currentRoom.localParticipant.publishData(encoder.encode(chatPayload), { reliable: true });

  appendChatMessage('mine', myName, msg, timeStr);
  input.value = '';
}

function appendChatMessage(type, name, message, timestamp) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `chat-msg ${type}`;

  // إخفاء الرموز لحماية الصفحة من الـ XSS
  const cleanName = document.createElement('div'); cleanName.textContent = name;
  const cleanMsg  = document.createElement('div'); cleanMsg.textContent = message;

  div.innerHTML = `
    ${type === 'theirs' ? `<div class="msg-sender">${cleanName.innerHTML}</div>` : ''}
    <div>${cleanMsg.innerHTML}</div>
    <div class="msg-time">${timestamp || ''}</div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ─── المغادرة والإغلاق الرسمي للغرفة ───
async function leaveRoom() {
  if (currentRoom) {
    currentRoom.disconnect();
  }

  // إعلام الباكيند لإسقاط وحذف الجلسة الحالية من الداتابيز
  const fd = new FormData();
  fd.append('room_id', roomId); fd.append('room_type', roomType); fd.append('student_id', studentId);
  await fetch('/rooms/leave', { method: 'POST', body: fd }).catch(() => {});

  window.location.href = 'study-rooms.html';
}

async function terminateRoom() {
  if (!confirm('Terminate this room? All members will be removed.')) return;
  try {
    if (currentRoom) currentRoom.disconnect();
    await fetch(`/rooms/${roomType}/${roomId}?student_id=${studentId}`, { method: 'DELETE' });
    window.location.href = 'study-rooms.html';
  } catch (_) { alert('Error terminating room.'); }
}
</script>
</body>
</html>
