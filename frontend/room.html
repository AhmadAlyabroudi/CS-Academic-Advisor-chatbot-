<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Room | JUST Advisor</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #070b13;
      --bg-panel: #0f1524;
      --bg-card: #172033;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glow-active: rgba(16, 185, 129, 0.45);
    }
    
    /* Lobby/Green Room Styles */
    .lobby-container {
      position: absolute;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem;
      z-index: 999;
      font-family: 'Inter', sans-serif;
    }
    
    .lobby-preview {
      position: relative;
      width: 480px;
      height: 270px;
      background: #111827;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .lobby-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    
    .lobby-preview .cam-off {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: absolute;
      inset: 0;
      justify-content: center;
      background: #0f1524;
      z-index: 2;
    }
    
    .lobby-controls {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      z-index: 10;
    }
    
    .lobby-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .lobby-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      transform: scale(1.05);
    }
    
    .lobby-btn.disabled {
      background: var(--danger);
      border-color: var(--danger);
    }
    
    .lobby-info {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .lobby-info h2 {
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .lobby-info p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.9rem;
    }
    
    .btn-join {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    
    .btn-join:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.4);
    }
    
    /* Room Styles */
    .room-container {
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      background: var(--bg-dark);
      border-radius: 1.5rem;
      margin: 0.5rem;
      color: var(--text-main);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
    }
    
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      background: rgba(15, 21, 36, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }
    
    .room-title h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .room-meta {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    .room-meta .tag {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
    }
    
    .tag-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
    .tag-purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.25); }
    
    .room-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .video-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: rgba(15, 21, 36, 0.3);
      border-radius: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .video-grid {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 0.75rem;
      padding: 0.5rem;
      align-content: center;
      justify-content: center;
      transition: all 0.3s ease-in-out;
    }
    
    .video-grid.presentation-mode {
      grid-template-columns: 4fr 1fr;
      grid-template-rows: repeat(auto-fill, minmax(120px, 1fr));
    }
    
    .video-card {
      background: var(--bg-card);
      border-radius: 1.25rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      aspect-ratio: 16/9;
      width: 100%;
      max-height: 100%;
    }
    
    .video-card.speaking {
      border-color: var(--success);
      box-shadow: 0 0 20px var(--glow-active);
    }
    
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }
    
    .video-card.remote-video video {
      transform: scaleX(1);
    }
    
    /* Screen share cards MUST NOT be mirrored */
    .video-card.screen-card video,
    #screenShareCard video {
      transform: scaleX(1) !important;
    }
    
    .video-card .cam-off {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: absolute;
      inset: 0;
      justify-content: center;
      background: #0f1524;
      z-index: 2;
      transition: opacity 0.3s ease;
    }
    
    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: white;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      user-select: none;
    }
    
    .participant-name {
      position: absolute;
      bottom: 0.75rem;
      left: 0.75rem;
      background: rgba(15, 21, 36, 0.7);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(15, 21, 36, 0.7);
      backdrop-filter: blur(8px);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 5;
    }
    
    .status-badge.muted {
      background: rgba(239, 68, 68, 0.85);
      color: white;
      border-color: rgba(239, 68, 68, 0.9);
    }
    
    .status-badge.unmuted {
      color: var(--success);
    }
    
    /* Presentation overlay styles */
    .video-grid.presentation-mode .screen-card {
      grid-column: 1;
      grid-row: 1 / -1;
      aspect-ratio: auto;
      height: 100%;
    }
    
    .video-grid.presentation-mode .video-card:not(.screen-card) {
      grid-column: 2;
      aspect-ratio: 16/9;
      height: auto;
    }
    
    .room-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 2rem;
      background: rgba(15, 21, 36, 0.75);
      backdrop-filter: blur(15px);
      border-radius: 5rem;
      width: fit-content;
      margin: 0 auto 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    
    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: #27354f;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 1.15rem;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .control-btn:hover {
      background: #3c4f75;
      color: white;
      transform: translateY(-2px);
    }
    
    .control-btn.active {
      background: var(--success);
      color: white;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    
    .control-btn.active#screenBtn {
      background: var(--info);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }
    
    .control-btn.active#chatBtn {
      background: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    
    .control-btn.disabled {
      background: var(--danger);
      color: white;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    
    .unread-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--danger);
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-leave {
      background: var(--danger);
      color: white;
      padding: 0 1.5rem;
      height: 50px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
      transition: all 0.2s;
    }
    
    .btn-leave:hover {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(239, 68, 68, 0.4);
    }
    
    .btn-terminate {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      padding: 0 1.25rem;
      height: 40px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-terminate:hover {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: var(--danger);
    }
    
    /* Chat Panel */
    .chat-panel {
      width: 340px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-radius: 1.25rem;
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.25);
    }
    
    .chat-panel.open {
      display: flex;
    }
    
    .chat-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    
    .chat-msg {
      padding: 0.65rem 0.85rem;
      border-radius: 1rem;
      max-width: 85%;
      word-break: break-word;
      font-size: 0.825rem;
      line-height: 1.4;
      position: relative;
    }
    
    .chat-msg.mine {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    
    .chat-msg.theirs {
      background: #27272a;
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    
    .chat-msg .msg-sender {
      font-weight: 700;
      font-size: 0.7rem;
      margin-bottom: 3px;
      color: rgba(255, 255, 255, 0.8);
    }
    
    .chat-msg.theirs .msg-sender {
      color: #a78bfa;
    }
    
    .chat-msg .msg-time {
      font-size: 0.625rem;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }
    
    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 0.65rem;
      background: rgba(15, 21, 36, 0.5);
    }
    
    .chat-input-area input {
      flex: 1;
      background: #172033;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 0.55rem 1rem;
      color: white;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input-area input:focus {
      border-color: var(--primary);
    }
    
    .chat-send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    .chat-send-btn:hover {
      background: var(--primary-hover);
    }

    /* Toast Notification */
    .meeting-toast {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      background: rgba(15, 21, 36, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }
    .meeting-toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
<div class="page-with-sidebar">
  <aside class="sidebar"></aside>
  <div class="main-content">
    <div class="top-bar"></div>
    
    <!-- Lobby / Join Preview Container -->
    <div class="lobby-container" id="lobbyContainer">
      <div class="lobby-preview">
        <video id="lobbyVideo" autoplay playsinline muted></video>
        <div id="lobbyPlaceholder" class="cam-off" style="display:none">
          <div class="avatar-circle" id="lobbyAvatar">S</div>
          <span style="font-size:0.85rem;color:var(--text-muted)">Camera is off</span>
        </div>
        <div class="lobby-controls">
          <button class="lobby-btn" id="lobbyMicBtn" onclick="toggleLobbyMic()"><i class="fas fa-microphone"></i></button>
          <button class="lobby-btn" id="lobbyCamBtn" onclick="toggleLobbyCam()"><i class="fas fa-video"></i></button>
        </div>
      </div>
      <div class="lobby-info">
        <h2 id="lobbyRoomName">Loading Room…</h2>
        <p id="lobbyRoomMeta">Join your study session</p>
        <button class="btn-join" onclick="joinMeeting()">Join Now</button>
      </div>
    </div>

    <!-- Room Container (starts hidden) -->
    <div class="content-area room-container" id="roomContainer" style="display:none">

      <!-- Header -->
      <div class="room-header">
        <div class="room-title">
          <h1 id="roomName">Loading Room…</h1>
          <div class="room-meta">
            <span id="roomTypeTag" class="tag">TYPE</span>
            <span><i class="fas fa-users"></i> <span id="memberCount">1</span> Members</span>
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;align-items:center;">
          <button id="terminateBtn" class="btn-terminate" style="display:none" onclick="terminateRoom()">
            Terminate Room
          </button>
          <button class="btn-leave" onclick="leaveRoom()">
            <i class="fas fa-phone-slash"></i> Leave Room
          </button>
        </div>
      </div>

      <!-- Body: video + chat -->
      <div class="room-body">
        <div class="video-area">
          <div class="video-grid" id="videoGrid">
            <!-- Local tile -->
            <div class="video-card" id="localCard">
              <div class="status-badge muted" id="localMicBadge">
                <i class="fas fa-microphone-slash"></i>
              </div>
              <video id="localVideo" autoplay playsinline muted style="display:none;"></video>
              <div id="localPlaceholder" class="cam-off">
                <div class="avatar-circle" id="avatarInitial">A</div>
                <span style="font-size:0.85rem;color:var(--text-muted)" id="localName">You</span>
              </div>
              <span class="participant-name" id="localDisplayName">You</span>
            </div>
            
            <!-- Screen-share tile (hidden until active) -->
            <div class="video-card screen-card" id="screenShareCard" style="display:none">
              <div class="status-badge">Screen Share</div>
              <video id="localScreen" autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>
            </div>
          </div>
        </div>

        <!-- Chat panel -->
        <div class="chat-panel" id="chatPanel">
          <div class="chat-header">
            <span><i class="fas fa-comments" style="margin-right:6px"></i>Room Chat</span>
            <button onclick="toggleChat()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1rem;">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message…" onkeydown="handleChatKey(event)"/>
            <button class="chat-send-btn" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="room-controls">
        <button class="control-btn disabled" id="micBtn" title="Toggle Mic" onclick="toggleMic()">
          <i class="fas fa-microphone-slash"></i>
        </button>
        <button class="control-btn disabled" id="camBtn" title="Toggle Camera" onclick="toggleCam()">
          <i class="fas fa-video-slash"></i>
        </button>
        <button class="control-btn" id="screenBtn" title="Share Screen" onclick="toggleScreen()">
          <i class="fas fa-desktop"></i>
        </button>
        <button class="control-btn" id="chatBtn" title="Toggle Chat" onclick="toggleChat()">
          <i class="fas fa-comments"></i>
          <span class="unread-badge" id="unreadBadge" style="display:none">0</span>
        </button>
      </div>

    </div>
    <footer class="site-footer"></footer>
  </div>
</div>

<script src="sidebar.js?v=8"></script>
<script>
// ─── XSS helper ──────────────────────────────────────────────────────────────
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

// Toast System
function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'meeting-toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('show');
  }, 100);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ─── Room params ──────────────────────────────────────────────────────────────
const params     = new URLSearchParams(window.location.search);
const roomId     = parseInt(params.get('id'));
const roomType   = params.get('type');
const roomKey    = `${roomType}:${roomId}`;
const studentId  = localStorage.getItem('student_id') || '';

// ─── State ────────────────────────────────────────────────────────────────────
let myName        = 'Student';
let isCreator     = false;
let localStream   = null;
let screenStream  = null;
let unreadCount   = 0;
let chatOpen      = false;

let lobbyMicEnabled = true;
let lobbyCamEnabled = true;

let iceConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
  ]
};

// Volume monitor for local
let audioContext = null, analyser = null, microphone = null, animId = null;

// Peer connections: remoteSid (socket ID) → { pc: RTCPeerConnection, name: string, userId: string, makingOffer: boolean, ignoreOffer: boolean, candidatesQueue: [], cameraStreamId: string, screenStreamId: string }
const peers = {};

// ─── Socket.IO ────────────────────────────────────────────────────────────────
const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
let socketReady = false;

function emitJoinRoom() {
  if (!roomKey || roomKey.includes('null') || roomKey.includes('undefined')) return;
  socket.emit('join_room', {
    room_id: roomId,
    room_type: roomType,
    user_id: studentId,
    name: myName,
  });
}

socket.on('connect', () => {
  if (socketReady) emitJoinRoom();
});

// استقبال قائمة المستخدمين المتواجدين حالياً قبل دخولنا
socket.on('existing-users', async ({ users }) => {
  for (const user of users) {
    if (user.sid !== socket.id) {
      addRemoteTile(user.sid, user.name, user.user_id);
      createPeerConnection(user.sid, user.name, user.user_id);
    }
  }
  broadcastMediaState();
});

// شخص جديد دخل الغرفة
socket.on('user-joined', ({ user_id, name, sid }) => {
  if (sid === socket.id) return;
  playChime('join');
  showToast(`${name} joined the room`);
  addRemoteTile(sid, name, user_id);
  createPeerConnection(sid, name, user_id);
  updateMemberCount();
  broadcastMediaState();
});

// شخص غادر الغرفة
socket.on('user-left', ({ sid, name }) => {
  if (sid) {
    playChime('leave');
    if (name) showToast(`${name} left the room`);
    removePeer(sid);
    updateMemberCount();
  }
});

socket.on('member-count', ({ count }) => {
  document.getElementById('memberCount').textContent = count;
});

// استقبال الـ WebRTC Offer
socket.on('offer', async ({ from, sdp }) => {
  await handleOffer(from, sdp);
});

// استقبال الـ WebRTC Answer
socket.on('answer', async ({ from, sdp }) => {
  try {
    const entry = peers[from];
    if (entry && entry.pc) {
      await entry.pc.setRemoteDescription(new RTCSessionDescription(sdp));
      
      // Process queued candidates
      if (entry.candidatesQueue && entry.candidatesQueue.length > 0) {
        for (const cand of entry.candidatesQueue) {
          try {
            await entry.pc.addIceCandidate(new RTCIceCandidate(cand));
          } catch (e) {
            console.error("Queued candidate error:", e);
          }
        }
        entry.candidatesQueue = [];
      }
    }
  } catch (err) {
    console.error('Error handling answer:', err);
  }
});

// استقبال الـ ICE Candidates
socket.on('ice-candidate', async ({ from, candidate }) => {
  try {
    const entry = peers[from];
    if (entry && candidate) {
      if (entry.pc.remoteDescription && entry.pc.remoteDescription.type) {
        await entry.pc.addIceCandidate(new RTCIceCandidate(candidate));
      } else {
        entry.candidatesQueue.push(candidate);
      }
    }
  } catch (_) {}
});

// استقبال الرسائل
socket.on('receive-message', ({ userId, user_id, name, message, timestamp }) => {
  const uid = userId || user_id;
  appendChatMessage(uid === studentId ? 'mine' : 'theirs', name, message, timestamp);
  if (!chatOpen) {
    unreadCount++;
    const badge = document.getElementById('unreadBadge');
    badge.textContent = unreadCount;
    badge.style.display = 'flex';
  }
});

// استقبال تحديث حالة الوسائط للآخرين
socket.on('user-media-toggled', ({ sid, mic, cam }) => {
  const ph = document.getElementById(`ph-${sid}`);
  const video = document.getElementById(`rv-${sid}`);
  const micBadge = document.getElementById(`mic-badge-${sid}`);
  
  if (video) {
    if (cam) {
      video.style.display = 'block';
      if (ph) ph.style.display = 'none';
    } else {
      video.style.display = 'none';
      if (ph) ph.style.display = 'flex';
    }
  }
  
  if (micBadge) {
    if (mic) {
      micBadge.className = 'status-badge unmuted';
      micBadge.innerHTML = '<i class="fas fa-microphone"></i>';
    } else {
      micBadge.className = 'status-badge muted';
      micBadge.innerHTML = '<i class="fas fa-microphone-slash"></i>';
    }
  }
});

// ─── WebRTC Engine with Perfect Negotiation & Collison Rollback ──────────────
function createPeerConnection(remoteSid, remoteName, remoteUserId) {
  const pc = new RTCPeerConnection(iceConfig);

  const entry = {
    pc,
    name: remoteName,
    userId: remoteUserId || remoteSid,
    makingOffer: false,
    ignoreOffer: false,
    candidatesQueue: [],
    cameraStreamId: null,
    screenStreamId: null
  };
  peers[remoteSid] = entry;

  // إرسال البث المحلي للطرف الآخر فوراً
  let addedVideo = false;
  let addedAudio = false;

  if (localStream) {
    localStream.getTracks().forEach(t => {
      pc.addTrack(t, localStream);
      if (t.kind === 'video') addedVideo = true;
      if (t.kind === 'audio') addedAudio = true;
    });
  }
  if (screenStream) {
    screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));
  }

  // W3C Transceivers: Force negotiation trigger even if local tracks are empty
  if (pc.addTransceiver) {
    if (!addedVideo) {
      pc.addTransceiver('video', { direction: 'recvonly' });
    }
    if (!addedAudio) {
      pc.addTransceiver('audio', { direction: 'recvonly' });
    }
  }

  // W3C Perfect Negotiation offer trigger
  pc.onnegotiationneeded = async () => {
    try {
      entry.makingOffer = true;
      await pc.setLocalDescription();
      socket.emit('offer', { target: remoteSid, sdp: pc.localDescription });
    } catch (err) {
      console.error('onnegotiationneeded error:', err);
    } finally {
      entry.makingOffer = false;
    }
  };

  // تبادل ICE Candidates
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('ice_candidate', { target: remoteSid, candidate: e.candidate });
    }
  };

  // استقبال البث المباشر (صوت/صورة) من الطرف الآخر
  pc.ontrack = (e) => {
    const stream = e.streams[0];
    const track = e.track;

    if (track.kind === 'video') {
      if (!entry.cameraStreamId) {
        entry.cameraStreamId = stream.id;
        attachRemoteStream(remoteSid, stream);
      } else if (stream.id !== entry.cameraStreamId) {
        entry.screenStreamId = stream.id;
        addRemoteScreenTile(remoteSid, entry.name, stream);
        track.onmute = track.onended = () => {
          removeRemoteScreenTile(remoteSid);
        };
      } else {
        attachRemoteStream(remoteSid, stream);
      }
    } else if (track.kind === 'audio') {
      startRemoteVolumeMonitor(remoteSid, stream);
    }
  };

  pc.onconnectionstatechange = () => {
    if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
      removePeer(remoteSid);
    }
  };

  return pc;
}

async function handleOffer(fromSid, sdp) {
  try {
    let entry = peers[fromSid];
    if (!entry) {
      addRemoteTile(fromSid, 'Student', fromSid);
      createPeerConnection(fromSid, 'Student', fromSid);
      entry = peers[fromSid];
    }

    const pc = entry.pc;
    const polite = socket.id < fromSid;
    const offerCollision = (sdp.type === 'offer') && (entry.makingOffer || pc.signalingState !== 'stable');

    entry.ignoreOffer = !polite && offerCollision;
    if (entry.ignoreOffer) {
      console.log('Collision: ignoring offer from impolite peer');
      return;
    }

    // Rollback local offer on collision
    if (offerCollision) {
      await Promise.all([
        pc.setLocalDescription({ type: 'rollback' }),
        pc.setRemoteDescription(new RTCSessionDescription(sdp))
      ]);
    } else {
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    }

    // Process queued candidates
    if (entry.candidatesQueue && entry.candidatesQueue.length > 0) {
      for (const cand of entry.candidatesQueue) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (e) {
          console.error("Queued candidate error:", e);
        }
      }
      entry.candidatesQueue = [];
    }

    if (sdp.type === 'offer') {
      await pc.setLocalDescription();
      socket.emit('answer', { target: fromSid, sdp: pc.localDescription });
    }
  } catch (err) {
    console.error('Error handling offer:', err);
  }
}

function addRemoteTile(sid, name, userId) {
  if (document.getElementById(`tile-${sid}`)) return;

  const card = document.createElement('div');
  card.className = 'video-card remote-video';
  card.id = `tile-${sid}`;
  const safeName = escapeHtml(name);
  
  // Create deterministic gradient color based on name hash
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const gradients = [
    'linear-gradient(135deg, #4f46e5, #06b6d4)',
    'linear-gradient(135deg, #ec4899, #8b5cf6)',
    'linear-gradient(135deg, #f59e0b, #e11d48)',
    'linear-gradient(135deg, #10b981, #3b82f6)'
  ];
  const bg = gradients[Math.abs(hash) % gradients.length];
  const initial = (name || 'S').charAt(0).toUpperCase();

  card.innerHTML = `
    <!-- Top-right status badge (mic status, initially muted/off) -->
    <div class="status-badge muted" id="mic-badge-${sid}">
      <i class="fas fa-microphone-slash"></i>
    </div>
    
    <!-- Camera-off placeholder -->
    <div class="cam-off" id="ph-${sid}">
      <div class="avatar-circle" style="background: ${bg}">${initial}</div>
      <span style="font-size:0.85rem;color:var(--text-muted)">${safeName}</span>
    </div>
    
    <!-- Video Element -->
    <video id="rv-${sid}" autoplay playsinline style="display:none;width:100%;height:100%;object-fit:cover;"></video>
    
    <!-- Bottom-left name overlay -->
    <span class="participant-name">
      <i class="fas fa-user-circle"></i>
      ${safeName}
    </span>
  `;
  document.getElementById('videoGrid').appendChild(card);
  rearrangeGrid();
}

function attachRemoteStream(sid, stream) {
  const video = document.getElementById(`rv-${sid}`);
  const ph = document.getElementById(`ph-${sid}`);
  if (video) {
    video.srcObject = stream;
    video.style.display = 'block';
    if (ph) ph.style.display = 'none';
  } else {
    setTimeout(() => attachRemoteStream(sid, stream), 200);
  }
}

function addRemoteScreenTile(sid, name, stream) {
  removeRemoteScreenTile(sid); // Clean old screen if any

  const grid = document.getElementById('videoGrid');
  const card = document.createElement('div');
  card.className = 'video-card screen-card';
  card.id = `screen-tile-${sid}`;
  card.innerHTML = `
    <div class="status-badge">Screen Share: ${escapeHtml(name)}</div>
    <video id="rv-screen-${sid}" autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>
  `;
  grid.appendChild(card);
  grid.classList.add('presentation-mode');
  
  const video = card.querySelector('video');
  video.srcObject = stream;
  
  rearrangeGrid();
}

function removeRemoteScreenTile(sid) {
  const tile = document.getElementById('screen-tile-' + sid);
  if (tile) {
    tile.remove();
  }
  const grid = document.getElementById('videoGrid');
  if (!grid.querySelector('.screen-card') && !screenStream) {
    grid.classList.remove('presentation-mode');
  }
  rearrangeGrid();
}

function removePeer(sid) {
  const entry = peers[sid];
  if (entry) {
    entry.pc.close();
    delete peers[sid];
  }
  const tile = document.getElementById(`tile-${sid}`);
  if (tile) tile.remove();
  removeRemoteScreenTile(sid);
  rearrangeGrid();
}

function updateMemberCount() {
  const count = 1 + Object.keys(peers).length;
  document.getElementById('memberCount').textContent = count;
}

// ─── Sound Chime Synthesis (Web Audio API) ───────────────────────────────────
function playChime(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    
    if (type === 'join') {
      osc.frequency.setValueAtTime(440, ctx.currentTime); // A4
      osc.frequency.setValueAtTime(554, ctx.currentTime + 0.12); // C#5
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } else if (type === 'leave') {
      osc.frequency.setValueAtTime(554, ctx.currentTime); // C#5
      osc.frequency.setValueAtTime(370, ctx.currentTime + 0.12); // F#4
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }
  } catch (e) {
    console.warn("Chime block:", e);
  }
}

// ─── Dynamic Layout Grid Rearrangement ───────────────────────────────────────
function rearrangeGrid() {
  const grid = document.getElementById('videoGrid');
  const tiles = Array.from(grid.querySelectorAll('.video-card'));
  const count = tiles.length;
  
  if (grid.classList.contains('presentation-mode')) {
    grid.style.display = 'grid';
    return;
  }
  
  grid.style.display = 'grid';
  
  if (count === 1) {
    grid.style.gridTemplateColumns = '1fr';
    grid.style.gridTemplateRows = '1fr';
  } else if (count === 2) {
    if (window.innerWidth > window.innerHeight) {
      grid.style.gridTemplateColumns = '1.2fr 1.2fr';
      grid.style.gridTemplateRows = '1fr';
    } else {
      grid.style.gridTemplateColumns = '1fr';
      grid.style.gridTemplateRows = '1fr 1fr';
    }
  } else if (count <= 4) {
    grid.style.gridTemplateColumns = '1fr 1fr';
    grid.style.gridTemplateRows = '1fr 1fr';
  } else if (count <= 6) {
    grid.style.gridTemplateColumns = '1fr 1fr 1fr';
    grid.style.gridTemplateRows = '1fr 1fr';
  } else {
    grid.style.gridTemplateColumns = '1fr 1fr 1fr';
    grid.style.gridTemplateRows = '1fr 1fr 1fr';
  }
}

window.addEventListener('resize', rearrangeGrid);

// ─── Volume and Speaking Indicators ──────────────────────────────────────────
function startVolumeMonitor() {
  if (!localStream || localStream.getAudioTracks().length === 0) return;
  const audioTrack = localStream.getAudioTracks()[0];
  if (!audioTrack.enabled) return;
  
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser     = audioContext.createAnalyser();
      microphone   = audioContext.createMediaStreamSource(localStream);
      microphone.connect(analyser);
      analyser.fftSize = 256;
    }
    const data   = new Uint8Array(analyser.frequencyBinCount);
    const micBtn = document.getElementById('micBtn');
    const localCard = document.getElementById('localCard');
    
    function check() {
      if (!analyser || !audioTrack.enabled) {
        micBtn.classList.remove('speaking');
        if (localCard) localCard.classList.remove('speaking');
        return;
      }
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const isMicActive = micBtn.classList.contains('active');
      
      if (avg > 22 && isMicActive) {
        micBtn.classList.add('speaking');
        if (localCard) localCard.classList.add('speaking');
      } else {
        micBtn.classList.remove('speaking');
        if (localCard) localCard.classList.remove('speaking');
      }
      animId = requestAnimationFrame(check);
    }
    check();
  } catch (err) {
    console.warn("Volume monitor err:", err);
  }
}

// Clean stop monitor
function stopVolumeMonitor() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  document.getElementById('micBtn').classList.remove('speaking');
  const localCard = document.getElementById('localCard');
  if (localCard) localCard.classList.remove('speaking');
}

function startRemoteVolumeMonitor(sid, audioTrack) {
  try {
    const remoteStream = new MediaStream([audioTrack]);
    const rCtx = new (window.AudioContext || window.webkitAudioContext)();
    const rAnalyser = rCtx.createAnalyser();
    const rSource = rCtx.createMediaStreamSource(remoteStream);
    rSource.connect(rAnalyser);
    rAnalyser.fftSize = 256;
    
    const data = new Uint8Array(rAnalyser.frequencyBinCount);
    
    function check() {
      const entry = peers[sid];
      const card = document.getElementById(`tile-${sid}`);
      if (!entry || !card) {
        rCtx.close();
        return;
      }
      
      const micBadge = document.getElementById(`mic-badge-${sid}`);
      const isMuted = micBadge && micBadge.classList.contains('muted');
      
      rAnalyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      
      if (avg > 22 && !isMuted) {
        card.classList.add('speaking');
      } else {
        card.classList.remove('speaking');
      }
      requestAnimationFrame(check);
    }
    check();
  } catch (e) {
    console.warn("Remote volume monitor warning:", e);
  }
}

// ─── Broadcast Local Media State ─────────────────────────────────────────────
function broadcastMediaState() {
  if (!socket.connected) return;
  const micActive = document.getElementById('micBtn').classList.contains('active');
  const camActive = document.getElementById('camBtn').classList.contains('active');
  socket.emit('toggle_media', {
    room_id: roomId,
    room_type: roomType,
    mic: micActive,
    cam: camActive
  });
}

// ─── Page Init ────────────────────────────────────────────────────────────────
async function loadIceServers() {
  try {
    const res = await fetch('/api/ice-servers');
    if (res.ok) {
      const data = await res.json();
      if (data.iceServers?.length) {
        iceConfig = { iceServers: data.iceServers };
      }
    }
  } catch (_) {}
}

// ─── Lobby / Green Room Setup ────────────────────────────────────────────────
async function initLobbyMedia() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    
    // Display preview
    const video = document.getElementById('lobbyVideo');
    video.srcObject = localStream;
    document.getElementById('lobbyPlaceholder').style.display = 'none';
  } catch (err) {
    console.warn("Could not get both video/audio in lobby, trying audio only.", err);
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      lobbyCamEnabled = false;
      document.getElementById('lobbyCamBtn').classList.add('disabled');
      document.getElementById('lobbyCamBtn').innerHTML = '<i class="fas fa-video-slash"></i>';
      document.getElementById('lobbyPlaceholder').style.display = 'flex';
    } catch (audioErr) {
      console.error("No media permission granted.", audioErr);
      localStream = new MediaStream();
      lobbyCamEnabled = false;
      lobbyMicEnabled = false;
      document.getElementById('lobbyCamBtn').classList.add('disabled');
      document.getElementById('lobbyCamBtn').innerHTML = '<i class="fas fa-video-slash"></i>';
      document.getElementById('lobbyMicBtn').classList.add('disabled');
      document.getElementById('lobbyMicBtn').innerHTML = '<i class="fas fa-microphone-slash"></i>';
      document.getElementById('lobbyPlaceholder').style.display = 'flex';
    }
  }
}

function toggleLobbyMic() {
  const btn = document.getElementById('lobbyMicBtn');
  lobbyMicEnabled = !lobbyMicEnabled;
  if (localStream && localStream.getAudioTracks().length > 0) {
    localStream.getAudioTracks()[0].enabled = lobbyMicEnabled;
  }
  btn.classList.toggle('disabled', !lobbyMicEnabled);
  btn.innerHTML = lobbyMicEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
}

function toggleLobbyCam() {
  const btn = document.getElementById('lobbyCamBtn');
  const video = document.getElementById('lobbyVideo');
  const ph = document.getElementById('lobbyPlaceholder');
  
  lobbyCamEnabled = !lobbyCamEnabled;
  if (localStream && localStream.getVideoTracks().length > 0) {
    localStream.getVideoTracks()[0].enabled = lobbyCamEnabled;
  }
  
  btn.classList.toggle('disabled', !lobbyCamEnabled);
  btn.innerHTML = lobbyCamEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
  
  if (lobbyCamEnabled) {
    video.style.display = 'block';
    ph.style.display = 'none';
  } else {
    video.style.display = 'none';
    ph.style.display = 'flex';
  }
}

async function joinMeeting() {
  // Hide lobby preview, show real meeting
  document.getElementById('lobbyContainer').style.display = 'none';
  document.getElementById('roomContainer').style.display = 'flex';
  
  // Set up real control buttons to match lobby selections
  const micBtn = document.getElementById('micBtn');
  const camBtn = document.getElementById('camBtn');
  const localMicBadge = document.getElementById('localMicBadge');
  const video = document.getElementById('localVideo');
  const ph = document.getElementById('localPlaceholder');
  
  // Sync microphone
  if (lobbyMicEnabled && localStream.getAudioTracks().length > 0) {
    micBtn.classList.remove('disabled');
    micBtn.classList.add('active');
    micBtn.querySelector('i').className = 'fas fa-microphone';
    localMicBadge.className = 'status-badge unmuted';
    localMicBadge.innerHTML = '<i class="fas fa-microphone"></i>';
    startVolumeMonitor();
  } else {
    micBtn.classList.add('disabled');
    micBtn.classList.remove('active');
    micBtn.querySelector('i').className = 'fas fa-microphone-slash';
    localMicBadge.className = 'status-badge muted';
    localMicBadge.innerHTML = '<i class="fas fa-microphone-slash"></i>';
    if (localStream.getAudioTracks().length > 0) {
      localStream.getAudioTracks()[0].enabled = false;
    }
  }
  
  // Sync camera
  if (lobbyCamEnabled && localStream.getVideoTracks().length > 0) {
    camBtn.classList.remove('disabled');
    camBtn.classList.add('active');
    camBtn.querySelector('i').className = 'fas fa-video';
    video.srcObject = localStream;
    video.style.display = 'block';
    ph.style.display = 'none';
  } else {
    camBtn.classList.add('disabled');
    camBtn.classList.remove('active');
    camBtn.querySelector('i').className = 'fas fa-video-slash';
    video.style.display = 'none';
    ph.style.display = 'flex';
    if (localStream.getVideoTracks().length > 0) {
      localStream.getVideoTracks()[0].enabled = false;
    }
  }
  
  // Connect and Join signaling room
  socketReady = true;
  if (socket.connected) emitJoinRoom();
  broadcastMediaState();
  rearrangeGrid();
  
  // Start local audio synthesis play context (requires user gesture)
  playChime('join');
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!roomId || !roomType) { window.location.href = 'study-rooms.html'; return; }

  await loadIceServers();

  // جلب معلومات الغرفة وتحديث العناوين بالصفحة
  try {
    const rRes = await fetch(`/rooms/${roomType}/${roomId}`);
    const room = await rRes.json();
    document.getElementById('roomName').textContent = room.name;
    document.getElementById('lobbyRoomName').textContent = room.name;
    const tag = document.getElementById('roomTypeTag');
    tag.textContent = room.type.toUpperCase();
    tag.className = `tag ${room.type === 'Official' ? 'tag-blue' : 'tag-purple'}`;
    document.getElementById('lobbyRoomMeta').textContent = `${room.type.toUpperCase()} STUDY ROOM`;

    isCreator = (room.creator_id === studentId);
    if (isCreator) document.getElementById('terminateBtn').style.display = 'inline-flex';
  } catch (_) {}

  // جلب اسم الطالب الحالي من قاعدة البيانات لتقديمه للآخرين بالغرفة
  try {
    const sRes = await fetch(`/student/${studentId}`);
    const s = await sRes.json();
    if (s && s.first_name) {
      myName = `${s.first_name} ${s.last_name}`;
      document.getElementById('localName').textContent = myName;
      document.getElementById('localDisplayName').textContent = myName;
      document.getElementById('avatarInitial').textContent = s.first_name.charAt(0).toUpperCase();
      document.getElementById('lobbyAvatar').textContent = s.first_name.charAt(0).toUpperCase();
    }
  } catch (_) {}

  // Initialize lobby preview first
  await initLobbyMedia();
});

// ─── Media controls ───────────────────────────────────────────────────────────
async function ensureLocalStream(needVideo = false, needAudio = false) {
  if (!localStream) {
    localStream = new MediaStream();
  }
  
  if (needVideo && localStream.getVideoTracks().length === 0) {
    try {
      const vs = await navigator.mediaDevices.getUserMedia({ video: true });
      vs.getVideoTracks().forEach(t => {
        localStream.addTrack(t);
        // Add track to existing peer connections
        for (const { pc } of Object.values(peers)) {
          pc.addTrack(t, localStream);
        }
      });
    } catch (e) {
      console.error("Could not obtain video track:", e);
      throw e;
    }
  }

  if (needAudio && localStream.getAudioTracks().length === 0) {
    try {
      const as = await navigator.mediaDevices.getUserMedia({ audio: true });
      as.getAudioTracks().forEach(t => {
        localStream.addTrack(t);
        // Add track to existing peer connections
        for (const { pc } of Object.values(peers)) {
          pc.addTrack(t, localStream);
        }
      });
    } catch (e) {
      console.error("Could not obtain audio track:", e);
      throw e;
    }
  }
}

async function toggleMic() {
  const btn = document.getElementById('micBtn');
  const icon = btn.querySelector('i');
  const localMicBadge = document.getElementById('localMicBadge');

  try {
    await ensureLocalStream(false, true);
    const track = localStream.getAudioTracks()[0];
    if (track) {
      const active = btn.classList.toggle('active');
      btn.classList.remove('disabled');
      track.enabled = active;
      icon.className = active ? 'fas fa-microphone' : 'fas fa-microphone-slash';
      if (!active) {
        btn.classList.add('disabled');
        localMicBadge.className = 'status-badge muted';
        localMicBadge.innerHTML = '<i class="fas fa-microphone-slash"></i>';
        stopVolumeMonitor();
      } else {
        localMicBadge.className = 'status-badge unmuted';
        localMicBadge.innerHTML = '<i class="fas fa-microphone"></i>';
        startVolumeMonitor();
      }
      broadcastMediaState();
    }
  } catch (err) {
    console.error('Mic toggle err:', err);
  }
}

async function toggleCam() {
  const btn = document.getElementById('camBtn');
  const icon = btn.querySelector('i');
  const video = document.getElementById('localVideo');
  const ph    = document.getElementById('localPlaceholder');

  try {
    await ensureLocalStream(true, false);
    const track = localStream.getVideoTracks()[0];
    if (track) {
      const active = btn.classList.toggle('active');
      btn.classList.remove('disabled');
      track.enabled = active;
      icon.className = active ? 'fas fa-video' : 'fas fa-video-slash';
      if (active) {
        video.srcObject = localStream;
        video.style.display = 'block';
        ph.style.display = 'none';
      } else {
        btn.classList.add('disabled');
        video.style.display = 'none';
        ph.style.display = 'flex';
      }
      broadcastMediaState();
    }
  } catch (err) {
    console.error('Cam toggle err:', err);
  }
}

async function toggleScreen() {
  const btn  = document.getElementById('screenBtn');
  const icon = btn.querySelector('i');
  const grid = document.getElementById('videoGrid');
  const card = document.getElementById('screenShareCard');

  if (btn.classList.contains('active')) {
    if (screenStream) {
      screenStream.getTracks().forEach(t => t.stop());
      // Remove screen share track from all peer connections
      for (const { pc } of Object.values(peers)) {
        const senders = pc.getSenders();
        screenStream.getTracks().forEach(track => {
          const sender = senders.find(s => s.track === track);
          if (sender) pc.removeTrack(sender);
        });
      }
      screenStream = null;
    }
    card.style.display = 'none';
    btn.classList.remove('active');
    icon.className = 'fas fa-desktop';
    
    if (!grid.querySelector('.screen-card')) {
      grid.classList.remove('presentation-mode');
    }
    rearrangeGrid();
  } else {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      document.getElementById('localScreen').srcObject = screenStream;
      card.style.display = 'flex';
      grid.classList.add('presentation-mode');
      btn.classList.add('active');
      icon.className = 'fas fa-desktop';
      
      const track = screenStream.getVideoTracks()[0];
      
      // Add track to all peer connections
      for (const { pc } of Object.values(peers)) {
        pc.addTrack(track, screenStream);
      }
      
      track.onended = () => {
        if (btn.classList.contains('active')) {
          toggleScreen();
        }
      };
      
      rearrangeGrid();
    } catch (err) {
      console.warn("Screen share cancel/error:", err);
    }
  }
}

// ─── Chat ─────────────────────────────────────────────────────────────────────
function toggleChat() {
  chatOpen = !chatOpen;
  const panel = document.getElementById('chatPanel');
  const btn   = document.getElementById('chatBtn');
  panel.classList.toggle('open', chatOpen);
  btn.classList.toggle('active', chatOpen);
  if (chatOpen) {
    unreadCount = 0;
    document.getElementById('unreadBadge').style.display = 'none';
    
    // Auto scroll chat
    const box = document.getElementById('chatMessages');
    box.scrollTop = box.scrollHeight;
  }
}

function handleChatKey(e) {
  if (e.key === 'Enter') sendChatMessage();
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const msg   = input.value.trim();
  if (!msg) return;
  input.value = '';
  socket.emit('send_message', {
    room_id: roomId,
    room_type: roomType,
    user_id: studentId,
    name: myName,
    message: msg,
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
  });
}

function appendChatMessage(type, name, message, timestamp) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `chat-msg ${type}`;
  div.innerHTML = `
    ${type === 'theirs' ? `<div class="msg-sender">${escapeHtml(name)}</div>` : ''}
    <div>${escapeHtml(message)}</div>
    <div class="msg-time">${escapeHtml(timestamp || '')}</div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ─── Leave / Terminate ────────────────────────────────────────────────────────
async function leaveRoom() {
  socket.emit('leave_room', { room_id: roomId, room_type: roomType, user_id: studentId, name: myName });
  Object.keys(peers).forEach(sid => { peers[sid].pc.close(); delete peers[sid]; });
  if (localStream)  localStream.getTracks().forEach(t => t.stop());
  if (screenStream) screenStream.getTracks().forEach(t => t.stop());

  const fd = new FormData();
  fd.append('room_id', roomId); fd.append('room_type', roomType); fd.append('student_id', studentId);
  await fetch('/rooms/leave', { method: 'POST', body: fd }).catch(() => {});
  socket.emit('room_created', {});
  window.location.href = 'study-rooms.html';
}

async function terminateRoom() {
  if (!confirm('Terminate this room? All members will be removed.')) return;
  try {
    await fetch(`/rooms/${roomType}/${roomId}?student_id=${studentId}`, { method: 'DELETE' });
    socket.emit('room_created', {});
    window.location.href = 'study-rooms.html';
  } catch (_) { alert('Error terminating room.'); }
}
