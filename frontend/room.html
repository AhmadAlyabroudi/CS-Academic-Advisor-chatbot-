<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room | JUST Advisor</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* التنسيق الأساسي للغرفة المظلمة */
        body { margin: 0; background-color: #12131a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: #1a1b23; border-right: 1px solid #2f3142; display: flex; flex-direction: column; }
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .room-title { font-size: 24px; font-weight: bold; }
        .video-container { flex: 1; background-color: #16171f; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #2f3142; }
        .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #16171f; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; border-radius: 12px; z-index: 10; }
        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(26,27,35,0.85); padding: 12px 25px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid #2f3142; z-index: 11; }
        .btn { width: 45px; height: 45px; border-radius: 50%; border: none; background: #2f3142; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 18px; }
        .btn:hover { background: #3f4259; }
        .btn-danger { background: #ea4335; width: auto; padding: 0 20px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .btn-danger:hover { background: #d93025; }
    </style>
</head>
<body>

    <div class="sidebar">
        </div>

    <div class="main-content">
        <div class="header">
            <div class="room-title" id="roomNameDisplay">Loading Room...</div>
            <button class="btn btn-danger" onclick="leaveRoom()"><i class="fas fa-sign-out-alt"></i> Leave Room</button>
        </div>

        <div class="video-container">
            <div id="loadingOverlay" class="loading-overlay">Loading Room...</div>
            <div id="remoteVideos" style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; height: 100%; padding: 10px;"></div>
        </div>

        <div class="controls">
            <button class="btn" id="micBtn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
            <button class="btn" id="camBtn" onclick="toggleCam()"><i class="fas fa-video"></i></button>
            <button class="btn" id="screenBtn" onclick="toggleScreen()"><i class="fas fa-desktop"></i></button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id') || '1';
        const roomType = urlParams.get('type') || 'Private';
        const studentId = '166001';
        const studentName = 'Ahmad Alyabroudi';

        let livekitRoom = new LiveKitClient.Room();
        let micEnabled = false;
        let camEnabled = false;

        async function initRoom() {
            try {
                // 1. جلب التوكن من الباكيند الخاص بك
                const response = await fetch(`/rooms/token?room_id=${roomId}&student_id=${studentId}&name=${encodeURIComponent(studentName)}`);
                if (!response.ok) throw new Error('Failed to fetch token');
                const tData = await response.json();

                document.getElementById('roomNameDisplay').innerText = `${roomType} Room #${roomId}`;

                // 2. الاتصال الفوري المباشر بـ LiveKit عبر بورت 7880 المشفر
                await livekitRoom.connect('wss://csacademicadvisorchatbot.codes:7880', tData.token);

                // إخفاء شاشة الـ Loading فوراً بمجرد نجاح الـ Handshake
                document.getElementById('loadingOverlay').style.display = 'none';
                console.log('Connected to room successfully!');

            } catch (err) {
                console.error(err);
                alert('Failed to connect to the global stream server.');
            }
        }

        function leaveRoom() {
            livekitRoom.disconnect();
            window.location.href = 'study-rooms.html';
        }

        function toggleMic() { micEnabled = !micEnabled; livekitRoom.localParticipant.setMicrophoneEnabled(micEnabled); document.getElementById('micBtn').innerHTML = micEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash" style="color:#ea4335;"></i>'; }
        function toggleCam() { camEnabled = !camEnabled; livekitRoom.localParticipant.setCameraEnabled(camEnabled); document.getElementById('camBtn').innerHTML = camEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash" style="color:#ea4335;"></i>'; }
        function toggleScreen() { alert('Screen sharing initialized.'); }

        // انطلاق المحرك فور تحميل الصفحة
        window.onload = initRoom;
    </script>
</body>
</html>
