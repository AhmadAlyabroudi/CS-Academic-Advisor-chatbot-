<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Chat History – Review your past AI advisor conversations."/>
  <title>Chat History | JUST Advisor</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* ── History page layout ──────────────────────────────────────────────── */
    .history-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .history-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary, #f1f5f9);
    }
    .history-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted, #64748b);
      margin-top: 2px;
    }
    .btn-new-chat {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent, #6366f1);
      color: #fff;
      border: none;
      border-radius: 0.6rem;
      padding: 0.55rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-new-chat:hover { background: #4f46e5; }

    /* ── Session card ─────────────────────────────────────────────────────── */
    .session-card {
      background: var(--bg-card, #1e293b);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 1rem;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .session-card:hover { border-color: rgba(99,102,241,0.35); }

    .session-summary {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
    }
    .session-icon {
      width: 40px;
      height: 40px;
      border-radius: 0.6rem;
      background: rgba(99,102,241,0.12);
      color: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .session-meta { flex: 1; min-width: 0; }
    .session-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary, #f1f5f9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-date {
      font-size: 0.75rem;
      color: var(--text-muted, #64748b);
      margin-top: 2px;
    }
    .session-badge {
      font-size: 0.7rem;
      background: rgba(99,102,241,0.12);
      color: #818cf8;
      border-radius: 20px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .session-chevron {
      color: var(--text-muted, #64748b);
      transition: transform 0.25s;
      font-size: 0.85rem;
    }
    .session-card.open .session-chevron { transform: rotate(90deg); }

    /* ── Session messages (collapsed by default) ─────────────────────────── */
    .session-messages {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 1rem 1.25rem;
      gap: 0.75rem;
      flex-direction: column;
    }
    .session-card.open .session-messages { display: flex; }

    .hist-msg {
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .hist-msg.hist-user { flex-direction: row-reverse; }

    .hist-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .hist-user .hist-avatar { background: rgba(99,102,241,0.2); color: #818cf8; }
    .hist-bot  .hist-avatar { background: rgba(34,197,94,0.15); color: #22c55e; }

    .hist-bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 0.85rem;
      font-size: 0.83rem;
      line-height: 1.55;
      color: var(--text-primary, #f1f5f9);
    }
    .hist-user .hist-bubble {
      background: rgba(99,102,241,0.15);
      border-bottom-right-radius: 4px;
    }
    .hist-bot .hist-bubble {
      background: var(--bg-elevated, #0f172a);
      border-bottom-left-radius: 4px;
    }
    .hist-source {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      margin-top: 5px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .src-official { background: rgba(34,197,94,0.12); color: #22c55e; border: 1px solid rgba(34,197,94,0.25); }
    .src-general  { background: rgba(251,191,36,0.12); color: #f59e0b; border: 1px solid rgba(251,191,36,0.25); }
    .src-demo     { background: rgba(148,163,184,0.1);  color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }

    /* ── Empty / loading states ───────────────────────────────────────────── */
    .history-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted, #64748b);
    }
    .history-empty i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; display: block; }
    .history-empty p { font-size: 0.9rem; }
    .history-loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted, #64748b);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<div class="page-with-sidebar">
  <aside class="sidebar"></aside>
  <div class="main-content">
    <div class="top-bar"></div>
    <div class="content-area">
      <div class="history-wrap">
        <div class="history-header">
          <div>
            <div class="history-title"><i class="fas fa-clock-rotate-left" style="margin-right:8px;color:var(--accent,#6366f1)"></i>Chat History</div>
            <div class="history-subtitle">All your past AI Advisor conversations, grouped by session</div>
          </div>
          <button class="btn-new-chat" onclick="window.location.href='/chatbot'">
            <i class="fas fa-plus"></i> New Consultation
          </button>
        </div>
        <div id="historyContainer">
          <div class="history-loading"><i class="fas fa-spinner fa-spin" style="margin-right:8px"></i>Loading history…</div>
        </div>
      </div>
    </div>
    <footer class="site-footer"></footer>
  </div>
</div>

<script src="sidebar.js?v=7"></script>
<script>
const studentId = localStorage.getItem('student_id') || '';

function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days  = Math.floor(diff / 86400000);
  if (mins < 1)   return 'Just now';
  if (mins < 60)  return `${mins}m ago`;
  if (hours < 24) return `${hours}h ago`;
  if (days < 7)   return `${days}d ago`;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function sourceBadge(source) {
  if (source === 'official') return `<span class="hist-source src-official"><i class="fas fa-graduation-cap"></i> Official</span>`;
  if (source === 'general')  return `<span class="hist-source src-general"><i class="fas fa-robot"></i> AI Insight</span>`;
  if (source === 'demo')     return `<span class="hist-source src-demo"><i class="fas fa-info-circle"></i> Demo</span>`;
  return '';
}

// Group flat message list into sessions by 60-min idle gaps
function groupIntoSessions(messages) {
  if (!messages.length) return [];
  const GAP_MS = 60 * 60 * 1000; // 60 minutes
  const sessions = [];
  let current = [messages[0]];

  for (let i = 1; i < messages.length; i++) {
    const prev = new Date(messages[i - 1].timestamp);
    const curr = new Date(messages[i].timestamp);
    if (curr - prev > GAP_MS) {
      sessions.push(current);
      current = [];
    }
    current.push(messages[i]);
  }
  sessions.push(current);
  return sessions.reverse(); // newest session first
}

function renderSessions(sessions) {
  const container = document.getElementById('historyContainer');

  if (!sessions.length) {
    container.innerHTML = `
      <div class="history-empty">
        <i class="fas fa-comment-slash"></i>
        <p>No conversations yet.<br/>Start a new session to see your history here.</p>
      </div>`;
    return;
  }

  container.innerHTML = '';

  sessions.forEach((msgs, idx) => {
    const firstUserMsg = msgs.find(m => m.sender_type === 'user');
    const title = firstUserMsg
      ? (firstUserMsg.message_content.length > 70
          ? firstUserMsg.message_content.slice(0, 70) + '…'
          : firstUserMsg.message_content)
      : 'Conversation';
    const lastMsg = msgs[msgs.length - 1];
    const msgCount = msgs.length;

    const card = document.createElement('div');
    card.className = 'session-card';
    card.innerHTML = `
      <div class="session-summary" onclick="toggleSession(this.closest('.session-card'))">
        <div class="session-icon"><i class="fas fa-comments"></i></div>
        <div class="session-meta">
          <div class="session-title">${esc(title)}</div>
          <div class="session-date">${formatDate(lastMsg?.timestamp)}</div>
        </div>
        <span class="session-badge">${msgCount} message${msgCount !== 1 ? 's' : ''}</span>
        <i class="fas fa-chevron-right session-chevron"></i>
      </div>
      <div class="session-messages">
        ${msgs.map(m => {
          const isUser = m.sender_type === 'user';
          const text = esc(m.message_content).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>');
          return `
            <div class="hist-msg ${isUser ? 'hist-user' : 'hist-bot'}">
              <div class="hist-avatar">
                <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
              </div>
              <div class="hist-bubble">
                ${text}
                ${!isUser && m.source ? sourceBadge(m.source) : ''}
              </div>
            </div>`;
        }).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleSession(card) {
  card.classList.toggle('open');
}

async function loadHistory() {
  if (!studentId) return;
  try {
    const res = await fetch(`/chat/history/${studentId}`);
    if (!res.ok) throw new Error('fetch failed');
    const messages = await res.json();
    const sessions = groupIntoSessions(messages);
    renderSessions(sessions);
  } catch (e) {
    document.getElementById('historyContainer').innerHTML = `
      <div class="history-empty">
        <i class="fas fa-exclamation-triangle" style="color:#ef4444"></i>
        <p>Could not load history. Make sure the backend is running.</p>
      </div>`;
  }
}

loadHistory();
</script>
</body>
</html>
