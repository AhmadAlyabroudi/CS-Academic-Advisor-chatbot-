# /etc/nginx/sites-available/justadvisor
# Symlink to /etc/nginx/sites-enabled/ to activate.

upstream justadvisor_app {
    server 127.0.0.1:8000;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name csacademicadvisorchatbot.codes www.csacademicadvisorchatbot.codes;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csacademicadvisorchatbot.codes www.csacademicadvisorchatbot.codes;

    # SSL — populated by Certbot
    ssl_certificate     /etc/letsencrypt/live/csacademicadvisorchatbot.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csacademicadvisorchatbot.codes/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # ── Static frontend files served directly by Nginx ────────────────────────
    location /frontend/ {
        alias /var/www/justadvisor/frontend/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # ── Socket.IO WebSocket upgrade ───────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://justadvisor_app/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://justadvisor_app;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
