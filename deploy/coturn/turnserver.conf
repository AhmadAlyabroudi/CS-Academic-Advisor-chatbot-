# coturn TURN server configuration
# Place at /etc/turnserver.conf on the Droplet.
# Then: sudo systemctl restart coturn

# ── Listening ─────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# ── External / relay IP (Droplet public IP) ───────────────────────────────────
external-ip=192.241.180.95
relay-ip=192.241.180.95

# ── TLS certificate (issued by Certbot — same cert as Nginx) ──────────────────
cert=/etc/letsencrypt/live/csacademicadvisorchatbot.codes/fullchain.pem
pkey=/etc/letsencrypt/live/csacademicadvisorchatbot.codes/privkey.pem

# ── Authentication ────────────────────────────────────────────────────────────
# Long-term credentials (static username/password).
# Must match TURN_USERNAME and TURN_CREDENTIAL in the backend .env file.
lt-cred-mech
user=justadvisor:Avanger@95_turn_password

realm=csacademicadvisorchatbot.codes
server-name=justadvisor-turn

# ── Security ──────────────────────────────────────────────────────────────────
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# ── Relay port range (open these in your Droplet firewall / ufw) ──────────────
min-port=49152
max-port=65535

# ── Logging ───────────────────────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
simple-log
