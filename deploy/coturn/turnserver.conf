# coturn TURN server configuration
# Place at /etc/turnserver.conf on the Droplet.
# Then: sudo systemctl restart coturn

# ── Listening ─────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# ── External IP (replace with your Droplet's public IP) ───────────────────────
# external-ip=YOUR_DROPLET_IP

# ── Relay address ─────────────────────────────────────────────────────────────
# relay-ip=YOUR_DROPLET_IP

# ── TLS certificate (issued by Certbot — same cert as Nginx) ──────────────────
# cert=/etc/letsencrypt/live/yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/yourdomain.com/privkey.pem

# ── Authentication ────────────────────────────────────────────────────────────
# Long-term credentials (static username/password).
# Must match TURN_USERNAME and TURN_CREDENTIAL in the backend .env file.
lt-cred-mech
user=justadvisor:CHANGE_ME_turn_password

realm=yourdomain.com
server-name=justadvisor-turn

# ── Security ──────────────────────────────────────────────────────────────────
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# ── Relay port range (open these in your Droplet firewall / ufw) ──────────────
min-port=49152
max-port=65535

# ── Logging ───────────────────────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
simple-log
